# Linux 原生 x64 / ARM64 headless 构建与测试。
name: build-linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_TAG: '2026.07.29'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            triplet: x64-linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            triplet: arm64-linux
    runs-on: ${{ matrix.runner }}
    # 兜底：GitHub 默认允许一个 job 跑 6 小时。首次编依赖（缓存未命中）约 30 分钟，
    # 90 分钟足够宽松；卡住的任务不该白烧六小时才被发现
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # apt 在 GitHub runner 上会偶发【挂死】（不是报错，是卡住不动）——v3.9.1 和
      # v3.9.3 两次发版都撞上，每次都要人工取消重跑。
      # 重试循环单独用不管用：挂死的进程不会退出，循环根本轮不到下一次。所以用
      # timeout 主动砍掉，再由外层循环重试；job 级 timeout-minutes 是最后兜底，
      # 免得卡住的任务白烧六小时
      - name: Install build tools
        timeout-minutes: 15
        run: |
          set -e
          ok=0
          for i in 1 2 3; do
            if timeout 240 sudo apt-get update -qq && \
               timeout 480 sudo apt-get install -y ninja-build pkg-config \
                            autoconf autoconf-archive automake libtool; then
              ok=1; break
            fi
            echo "── apt 第 $i 次超时或失败，15 秒后重试 ──"
            sudo killall apt-get dpkg 2>/dev/null || true
            sudo dpkg --configure -a || true
            sleep 15
          done
          [ "$ok" = "1" ] || { echo "apt 三次均失败"; exit 1; }

      - name: Install pinned CMake on ARM64
        if: matrix.arch == 'arm64'
        run: |
          curl --fail --location --retry 3 \
            https://github.com/Kitware/CMake/releases/download/v4.4.5/cmake-4.4.5-linux-aarch64.tar.gz \
            --output "$RUNNER_TEMP/cmake-arm64.tar.gz"
          echo "301d5063ab259577c1b57ce5490b1aab9ea5c56dc4c822f73499553dab94925f  $RUNNER_TEMP/cmake-arm64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cmake-arm64.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-4.4.5-linux-aarch64/bin" >> "$GITHUB_PATH"

      - name: Set up vcpkg
        run: |
          git clone --depth 1 --branch "$VCPKG_TAG" https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-${{ matrix.arch }}-

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCCBOT_WERROR=ON \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DCCBOT_BUILD_GUI=OFF -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON

      # -k 0 = 一个目标失败也把其余编完。-Werror 开了之后这很要紧：
      # 默认行为是首个 TU 报错就停，于是一轮 CI 只能暴露一个错误，修一个再推一轮。
      # 编完再报能一次拿全清单
      # ⚠ pipefail 不能省。管道的退出码默认取【最后一个命令】（tee，永远成功），
      #   所以没有它的时候【编译失败根本不会让这一步失败】——v5.0.0 那次就是这样：
      #   三个编译错误被吞掉，Build 显示成功，直到四步之后的测试阶段才以
      #   "./build/xxx: No such file or directory"（exit 127）的形式冒出来，
      #   而那个信息完全指不向真正的原因
      - name: Build
        run: |
          set -o pipefail
          cmake --build build -- -k 0 2>&1 | tee build.log

      # 警告清单。v4.7.1 起 -DCCBOT_WERROR=ON，警告已经是【硬门禁】——有警告的话
      # 上面那步 Build 就直接失败了，走不到这里。
      #
      # 那为什么还留着：Build 失败时 GCC 的输出混在一大堆编译命令里，这一步用
      # if: always() 把自有代码的警告单独摘出来排好，省掉翻日志。
      # vcpkg 依赖和 Qt moc 的警告不统计——我们既管不了也不该管。
      - name: Warning summary
        if: always()
        run: |
          set +e
          grep -E "warning:|error:" build.log | grep -E "/(src|tests|tools)/" | sort -u > warn.txt
          n=$(wc -l < warn.txt)
          if [ "$n" = "0" ]; then
            echo "✅ 自有代码零警告"
          else
            echo "── 自有代码的 GCC 警告/错误：$n 条 ──"
            cat warn.txt
          fi

      - name: Save vcpkg binary cache (even on failure)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Upload vcpkg failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: vcpkg-failure-logs-linux-${{ matrix.arch }}
          path: |
            build/vcpkg-manifest-install.log
            ${{ runner.temp }}/vcpkg/buildtrees/*/*.log
          if-no-files-found: ignore

      - name: Run all test suites
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2

      - name: Test legacy symbol recovery
        run: python3 tests/test_symbol_repair.py

      - name: Test package policy
        run: python3 tests/test_package_layout.py

      - name: Package
        run: |
          set -e
          mkdir -p pkg
          cp build/ccbot_headless pkg/
          chmod +x pkg/ccbot_headless
          python3 tools/check_unix_package.py pkg --platform linux --arch ${{ matrix.arch }}

      # 泄漏检查同样是硬门禁。config.example.json 是模板（不含真凭证），但白名单
      # 只放行可执行文件，所以要在检查【之后】再放进 zip
      - name: Leak check (hard gate)
        run: |
          VER="$(python3 tools/release_metadata.py --version)"
          python3 tools/leak_check.py pkg --expect-version "$VER" --exe ccbot_headless

      - name: Include Linux configuration, quick start and licenses
        shell: bash
        run: |
          set -e
          cp config.example.json pkg/
          cp docs/LINUX_PACKAGE.md pkg/README.md
          mkdir -p pkg/licenses/TradingBot
          cp LICENSE pkg/licenses/TradingBot/
          for notice in build/vcpkg_installed/${{ matrix.triplet }}/share/*/copyright; do
            test -f "$notice" || continue
            dep=$(basename "$(dirname "$notice")")
            mkdir -p "pkg/licenses/$dep"
            cp "$notice" "pkg/licenses/$dep/"
          done

      - name: Verify final headless package
        run: python3 tools/check_package_layout.py pkg --platform linux

      - name: Zip
        run: |
          VER="$(python3 tools/release_metadata.py --version)"
          cd pkg && zip -r "../tradingbot-$VER-linux-${{ matrix.arch }}.zip" . && cd ..
          ls -la tradingbot-*.zip

      - name: Record source and archive outside the package
        run: |
          VER="$(python3 tools/release_metadata.py --version)"
          python3 tools/release_metadata.py --output release-info --archive "tradingbot-$VER-linux-${{ matrix.arch }}.zip" --triplet ${{ matrix.triplet }}

      # 标签构建产物保留供下载检查，不自动创建或更改正式 Release。
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: tradingbot-linux-${{ matrix.arch }}
          path: |
            tradingbot-*.zip
            release-info/
