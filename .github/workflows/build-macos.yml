# macOS 原生双架构构建；GUI 为 .app，headless 为命令行程序。
name: build-macos

on:
  push:
    branches: [main]              # 推 main 就跑：不要等到发布那一刻才发现编不过
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 构建只读；正式 Release 由已核验的发布流程单独上传。
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64            # Apple Silicon（M系列）
            runner: macos-15
            triplet: arm64-osx
          - arch: x64              # Intel Mac
            runner: macos-15-intel
            triplet: x64-osx
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install build tools
        # autoconf 系列是 libb2（qtbase 依赖）的构建要求，runner 没预装
        run: brew install ninja pkg-config autoconf autoconf-archive automake libtool

      - name: Set up vcpkg
        run: |
          git clone --depth 1 --branch 2026.07.29 https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"

      # vcpkg 编译好的依赖包缓存（第一次跑 Qt 要几十分钟，之后命中缓存只要几分钟）。
      # 用 restore+save 拆开而不是 actions/cache：失败的构建也要把已编译好的包存下来，
      # 否则每次调试失败都要从零重编所有依赖
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-osx-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-osx-${{ matrix.arch }}-

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCCBOT_WERROR=ON \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      # -k 0 = 一个目标失败也把其余编完。-Werror 开了之后这很要紧：
      # 默认行为是首个 TU 报错就停，于是一轮 CI 只能暴露一个错误，修一个再推一轮。
      # 编完再报能一次拿全清单
      - name: Build
        run: cmake --build build -- -k 0

      - name: Save vcpkg binary cache (even on failure)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-osx-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      # 依赖编译失败时把 vcpkg 的详细日志传出来，否则只能看到 BUILD_FAILED 一个词
      - name: Upload vcpkg failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: vcpkg-failure-logs-${{ matrix.arch }}
          path: |
            build/vcpkg-manifest-install.log
            /Users/runner/vcpkg/buildtrees/*/*.log
          if-no-files-found: ignore

      # 全部测试套件。此前只跑指标那一套，风控闸门/资金费/限流/订单路径/凭证存储
      # 五套都没跑过——测试写了却没人守着

      - name: Run all test suites
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2

      - name: Package
        run: |
          mkdir -p pkg
          cmake --install build --prefix "$PWD/pkg"
          codesign --force --deep --sign - pkg/TradingBot.app
          python3 tools/check_unix_package.py pkg --platform macos --arch ${{ matrix.arch }}
          codesign --verify --deep --strict pkg/TradingBot.app

      # 硬门禁：白名单校验 + 内嵌版本号核对。mac 包此前完全没有这一步
      - name: Leak check (hard gate)
        run: |
          VER="$(python3 tools/release_metadata.py --version)"
          python3 tools/leak_check.py pkg --expect-version "$VER" --exe TradingBot.app/Contents/MacOS/TradingBot
          python3 tools/leak_check.py pkg --expect-version "$VER" --exe ccbot_headless

      - name: Include documentation and dependency licenses
        shell: bash
        run: |
          set -e
          cp LICENSE README.md config.example.json pkg/
          cp -R docs pkg/
          mkdir -p pkg/licenses
          for notice in build/vcpkg_installed/${{ matrix.triplet }}/share/*/copyright; do
            test -f "$notice" || continue
            dep=$(basename "$(dirname "$notice")")
            mkdir -p "pkg/licenses/$dep"
            cp "$notice" "pkg/licenses/$dep/"
          done

      - name: Record source and dependencies
        run: python3 tools/release_metadata.py --package pkg --triplet ${{ matrix.triplet }}

      - name: Zip
        run: |
          VER="$(python3 tools/release_metadata.py --version)"
          cd pkg && zip -r "../tradingbot-$VER-macos-${{ matrix.arch }}.zip" . && cd ..
          ls -la tradingbot-*.zip

      # 标签构建产物保留供下载检查，不自动创建或更改正式 Release。
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: tradingbot-macos-${{ matrix.arch }}
          path: tradingbot-*-macos-${{ matrix.arch }}.zip
